name: Mobile baseline checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Validate Expo configuration
        run: npx expo config --type public > /dev/null
