name: Synchronize workout recovery lockfile
on:
  workflow_dispatch:
  push:
    branches:
      - feat/timed-workout-draft-recovery
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/timed-workout-draft-recovery
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit updated lockfile if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Sync AsyncStorage dependency lockfile"
            git push origin HEAD:feat/timed-workout-draft-recovery
          fi
