name: Build Android test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-apk
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Check build prerequisites
        shell: bash
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::Missing EXPO_TOKEN repository secret"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "::error::Missing EXPO_PUBLIC_SUPABASE_URL secret"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "::error::Missing EXPO_PUBLIC_SUPABASE_ANON_KEY secret"; exit 1; }
          node -e 'const a=require("./app.json").expo; if (!a?.extra?.eas?.projectId) { console.error("::error::Link an Expo EAS project and commit extra.eas.projectId in app.json first"); process.exit(1) }'
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Queue Android preview APK
        run: eas build --platform android --profile preview --non-interactive --no-wait
